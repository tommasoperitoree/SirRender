name: Deploy Dokka Documentation

on:
  push:
    tags:
      - 'v*'          # triggers on v0.1.0, v0.2.0, etc.
  workflow_dispatch:  # manual trigger

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write     # needs write to push to gh-pages branch
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to get tag info

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Dokka
        run: ./gradlew :dokkaGeneratePublicationHtml --configuration-cache

      - name: Deploy versioned docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/dokka/html
          destination_dir: ${{ steps.version.outputs.VERSION }}  # e.g. /v0.2.0/

      - name: Deploy as latest
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/dokka/html
          destination_dir: latest

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true